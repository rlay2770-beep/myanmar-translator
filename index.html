<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Smart Translator Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0F172A; color: #F8FAFC; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 600px; background: #1E293B; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #06B6D4; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #94A3B8; font-size: 13px; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #0F172A; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .lang-indicator { color: #06B6D4; font-weight: bold; font-size: 14px; }
        .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .box-title { font-size: 14px; color: #CBD5E1; }
        .char-count { font-size: 12px; color: #64748B; }
        textarea { width: 100%; height: 110px; background: #0F172A; border: 1px solid #334155; color: #FFF; padding: 12px; border-radius: 10px; resize: none; font-size: 15px; outline: none; }
        textarea:focus { border-color: #06B6D4; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { background: #334155; color: #FFF; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; transition: 0.2s; text-decoration: none; }
        .btn:hover { background: #475569; }
        .btn-call { background: #10B981; color: #FFF; }
        .btn-viber { background: #7360F2; color: #FFF; }
        .btn-clear { background: #EF4444; color: #FFF; font-size: 11px; padding: 4px 8px; }
        .btn-translate { background: #06B6D4; color: #000; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; border: none; font-size: 16px; }
        .btn-translate:hover { background: #22D3EE; }

        /* Speech Settings Controls */
        .speech-controls {
            background: #0F172A;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 12px; color: #94A3B8; display: flex; justify-content: space-between; }
        .control-group input[type="range"] {
            accent-color: #06B6D4;
            cursor: pointer;
        }

        .history-box { margin-top: 8px; background: #0F172A; padding: 10px; border-radius: 8px; border: 1px solid #334155; max-height: 120px; overflow-y: auto; font-size: 12px; color: #94A3B8; }
        .history-item { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #1E293B; }
        .donation-card { margin-top: 20px; background: rgba(6, 182, 212, 0.1); border: 1px dashed #06B6D4; padding: 12px; border-radius: 10px; text-align: center; font-size: 13px; }
        .donation-card b { color: #06B6D4; }
        .num-box { display: inline-block; background: #0F172A; padding: 4px 10px; border-radius: 6px; margin: 5px 0; font-family: monospace; font-size: 14px; color: #06B6D4; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Myanmar Smart Translator</h1>
        <p>အင်္ဂလိပ် ↔ မြန်မာ အလိုအလျောက် ဘာသာပြန်စနစ်</p>
    </div>

    <div class="controls">
        <span class="lang-indicator">🔄 Auto-Detect (EN ↔ MM)</span>
        <button class="btn" onclick="startVoiceInput()">🎙️ အသံဖြင့်ပြောမည်</button>
    </div>

    <!-- Input Box -->
    <div class="box-header">
        <div class="box-title">စာရိုက်ထည့်ရန်:</div>
        <div class="char-count" id="inputCount">0 စာလုံး</div>
    </div>
    <textarea id="inputText" placeholder="Type English or Myanmar text here..." oninput="updateCount()"></textarea>
    
    <div class="btn-group">
        <button class="btn" onclick="pasteText()">📋 Paste</button>
        <button class="btn" onclick="cleanText()">🧹 Clean</button>
    </div>

    <button class="btn-translate" onclick="translateText()">Translate (ဘာသာပြန်ရန်)</button>

    <!-- Output Box -->
    <div class="box-header">
        <div class="box-title">ဘာသာပြန် ရလဒ်:</div>
    </div>
    <textarea id="outputText" readonly placeholder="ဘာသာပြန်ထားသော စာပိုဒ်များ ဤနေရာတွင် ပေါ်လာမည်..."></textarea>
    
    <div class="btn-group">
        <button class="btn" onclick="copyText()">📄 Copy</button>
        <button class="btn" onclick="speakOutput()">🔊 အသံထွက်နားထောင်မည်</button>
        <button class="btn" onclick="stopOutput()" style="background: #64748B;">⏹️ ရပ်မည်</button>
    </div>

    <!-- Audio Settings (Volume & Speed) -->
    <div class="speech-controls">
        <div class="control-group">
            <label><span>🔊 အသံအတိုးအကျယ် (Volume):</span> <b id="volVal" style="color:#06B6D4;">100%</b></label>
            <input type="range" id="volumeRange" min="0" max="1" step="0.1" value="1" oninput="document.getElementById('volVal').innerText = Math.round(this.value * 100) + '%'">
        </div>
        <div class="control-group">
            <label><span>⚡ အရှိန်နှုန်း (Speed):</span> <b id="speedVal" style="color:#06B6D4;">1.0x</b></label>
            <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('speedVal').innerText = this.value + 'x'">
        </div>
    </div>

    <!-- History List Section -->
    <div class="box-header" style="margin-top: 15px;">
        <div class="box-title">🕒 မကြာသေးမီက ဘာသာပြန်မှုများ:</div>
        <button class="btn btn-clear" onclick="clearHistory()">🗑️ Clear History</button>
    </div>
    <div class="history-box" id="historyList">
        <i>မှတ်တမ်းမရှိသေးပါ။</i>
    </div>

    <!-- Support / Contact Card -->
    <div class="donation-card">
        ကူညီထောက်ပံ့နိုင်ပါသည် ❤️<br>
        <b>WavePay / Phone:</b> <span class="num-box">09663711680</span>
        
        <div class="btn-group" style="justify-content: center; margin-bottom: 0; margin-top: 8px;">
            <a href="tel:09663711680" class="btn btn-call">📞 တိုက်ရိုက်ဖုန်းခေါ်မည်</a>
            <a href="viber://chat?number=%2B959663711680" class="btn btn-viber">💬 Viber သို့သွားမည်</a>
            <button class="btn" onclick="copyWave()">📋 Copy Number</button>
        </div>
    </div>
</div>

<script>
    function updateCount() {
        const text = document.getElementById('inputText').value;
        document.getElementById('inputCount').innerText = text.length + ' စာလုံး';
    }

    async function pasteText() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('inputText').value = text;
            updateCount();
        } catch (err) {
            alert('Paste လုပ်ရန် ခွင့်ပြုချက်မရရှိပါ။');
        }
    }

    function cleanText() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateCount();
    }

    function copyText() {
        const output = document.getElementById('outputText');
        if(!output.value) return;
        output.select();
        document.execCommand('copy');
        alert('Copy ကူးပြီးပါပြီ!');
    }

    function copyWave() {
        navigator.clipboard.writeText('09663711680');
        alert('ဖုန်းနံပါတ် 09663711680 ကို Copy ကူးပြီးပါပြီ!');
    }

    // Speech to Text (အသံဖြင့် စာရိုက်ခြင်း)
    function startVoiceInput() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('သင့် Browser တွင် Voice Input စနစ် မပံ့ပိုးပါ။ Google Chrome ကို သုံးပေးပါ။');
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';

        recognition.onstart = function() {
            document.getElementById('inputText').placeholder = 'စကားပြောပါ... နားထောင်နေသည်...';
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('inputText').value = transcript;
            updateCount();
        };

        recognition.start();
    }

    // Text-to-Speech + Volume & Speed Control
    function speakOutput() {
        const text = document.getElementById('outputText').value.trim();
        if (!text) {
            alert('ဖတ်ပြရန် စာမရှိသေးပါ။');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('သင့် Browser တွင် အသံထွက်စနစ် မပံ့ပိုးပါ။');
            return;
        }

        window.speechSynthesis.cancel(); // အဟောင်းရပ်မည်

        const utterance = new SpeechSynthesisUtterance(text);
        
        // Volume နဲ့ Speed တန်ဖိုးများကို Slider မှ ယူခြင်း
        const volumeVal = parseFloat(document.getElementById('volumeRange').value);
        const speedVal = parseFloat(document.getElementById('speedRange').value);

        utterance.volume = volumeVal; // 0 မှ 1
        utterance.rate = speedVal;    // 0.5 မှ 2

        const isMyanmar = /[\u1000-\u109F]/.test(text);
        utterance.lang = isMyanmar ? 'my-MM' : 'en-US';

        window.speechSynthesis.speak(utterance);
    }

    // အသံထွက်ကို ချက်ချင်း ရပ်တန့်သည့် Function
    function stopOutput() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    // History ကို LocalStorage တွင် သိမ်းခြင်း
    function saveToHistory(input, output) {
        let history = JSON.parse(localStorage.getItem('trans_history') || '[]');
        history.unshift({ input, output });
        if (history.length > 10) history.pop();
        localStorage.setItem('trans_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem('trans_history') || '[]');
        const box = document.getElementById('historyList');
        if (history.length === 0) {
            box.innerHTML = '<i>မှတ်တမ်းမရှိသေးပါ။</i>';
            return;
        }
        box.innerHTML = history.map(item => `
            <div class="history-item">
                <b>• ${item.input}</b> ➔ <span style="color: #06B6D4;">${item.output}</span>
            </div>
        `).join('');
    }

    function clearHistory() {
        if(confirm("History မှတ်တမ်းအားလုံးကို ဖျက်ပစ်ရန် သေချာပါသလား?")) {
            localStorage.removeItem('trans_history');
            renderHistory();
        }
    }

    // Translate Core Function
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const outputBox = document.getElementById('outputText');
        
        if (!text) {
            alert('ကျေးဇူးပြု၍ စာရိုက်ထည့်ပါ။');
            return;
        }

        outputBox.value = 'ဘာသာပြန်နေပါသည်... ခဏစောင့်ပါ...';

        const isMyanmar = /[\u1000-\u109F]/.test(text);
        const sourceLang = isMyanmar ? 'my' : 'en';
        const targetLang = isMyanmar ? 'en' : 'my';

        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            
            let translatedText = '';
            if (data && data[0]) {
                data[0].forEach(item => {
                    if (item[0]) translatedText += item[0];
                });
            }

            outputBox.value = translatedText;
            saveToHistory(text, translatedText);
        } catch (error) {
            outputBox.value = 'ဘာသာပြန်ရာတွင် အမှားအယွင်းရှိနေပါသည်။ အင်တာနက်စစ်ပါ။';
        }
    }

    renderHistory();
</script>

</body>
        </html>
