<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Translator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0F172A; /* Deep Charcoal */
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1E293B;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #06B6D4; /* Neon Cyan */
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: #94A3B8;
            font-size: 13px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #0F172A;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .lang-indicator {
            color: #06B6D4;
            font-weight: bold;
            font-size: 14px;
        }
        .mode-select {
            background: #334155;
            color: #FFF;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
        }
        .box-title {
            font-size: 14px;
            color: #CBD5E1;
            margin-bottom: 6px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #0F172A;
            border: 1px solid #334155;
            color: #FFF;
            padding: 12px;
            border-radius: 10px;
            resize: none;
            font-size: 15px;
            outline: none;
        }
        textarea:focus {
            border-color: #06B6D4;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        .btn {
            background: #334155;
            color: #FFF;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #475569;
        }
        .btn-translate {
            background: #06B6D4;
            color: #000;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .btn-translate:hover {
            background: #22D3EE;
        }
        .donation-card {
            margin-top: 25px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px dashed #06B6D4;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
        }
        .donation-card b {
            color: #06B6D4;
        }
        .num-box {
            display: inline-block;
            background: #0F172A;
            padding: 4px 10px;
            border-radius: 6px;
            margin: 5px 0;
            font-family: monospace;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Myanmar Translator</h1>
        <p>အင်္ဂလိပ် ↔ မြန်မာ နှစ်ဦးနှစ်ဖက် အပြန်အလှန် ဘာသာပြန်စနစ်</p>
    </div>

    <!-- Direction Indicator & Mode Selector -->
    <div class="controls">
        <span class="lang-indicator">🔄 Auto-Detect (EN ↔ MM)</span>
        <select id="toneSelect" class="mode-select">
            <option value="casual">အရပ်ဘက်သုံး (Casual)</option>
            <option value="formal">ရုံးသုံး / တရားဝင် (Formal)</option>
            <option value="academic">ကျောင်းသုံး / ပညာရပ် (Academic)</option>
        </select>
    </div>

    <!-- Input Box -->
    <div class="box-title">စာရိုက်ထည့်ရန် (အင်္ဂလိပ် သို့မဟုတ် မြန်မာ):</div>
    <textarea id="inputText" placeholder="Type English or Myanmar text here... (အင်္ဂလိပ် သို့မဟုတ် မြန်မာစာ ရိုက်ထည့်ပါ)"></textarea>
    
    <div class="btn-group">
        <button class="btn" onclick="pasteText()">📋 Paste</button>
        <button class="btn" onclick="cleanText()">🧹 Clean (ဖျက်ရန်)</button>
    </div>

    <!-- Translate Button -->
    <button class="btn-translate" onclick="translateText()">Translate (ဘာသာပြန်ရန်)</button>

    <!-- Output Box -->
    <div class="box-title">ဘာသာပြန် ရလဒ်:</div>
    <textarea id="outputText" readonly placeholder="ဘာသာပြန်ထားသော စာပိုဒ်များ ဤနေရာတွင် ပေါ်လာမည်..."></textarea>
    
    <div class="btn-group">
        <button class="btn" onclick="copyText()">📄 Copy (ကူးယူရန်)</button>
    </div>

    <!-- Support / Donation Card -->
    <div class="donation-card">
        ဒီ App လေးကို အခမဲ့ ဆက်လက် လည်ပတ်နိုင်ဖို့ စေတနာအလျောက် ကူညီထောက်ပံ့နိုင်ပါသည် ❤️<br>
        <b>WavePay:</b> <span class="num-box" id="waveNum">09663711680</span><br>
        <button class="btn" style="margin: 5px auto 0 auto;" onclick="copyWave()">Copy Wave Number</button>
    </div>
</div>

<script>
    // Paste Function
    async function pasteText() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('inputText').value = text;
        } catch (err) {
            alert('Paste လုပ်ရန် ခွင့်ပြုချက်မရရှိပါ။ စာကို တိုက်ရိုက် Paste ထည့်ပေးပါ။');
        }
    }

    // Clean Function
    function cleanText() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
    }

    // Copy Function
    function copyText() {
        const output = document.getElementById('outputText');
        if(!output.value) return;
        output.select();
        document.execCommand('copy');
        alert('ဘာသာပြန်ထားသော စာပိုဒ်ကို Copy ကူးပြီးပါပြီ!');
    }

    // Copy Wave Number Function
    function copyWave() {
        const num = document.getElementById('waveNum').innerText;
        navigator.clipboard.writeText(num);
        alert('WavePay ဖုန်းနံပါတ် 09663711680 ကို Copy ကူးပြီးပါပြီ!');
    }

    // Smart Bi-directional Translation Logic (English <-> Myanmar)
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const outputBox = document.getElementById('outputText');
        
        if (!text) {
            alert('ကျေးဇူးပြု၍ စာရိုက်ထည့်ပါ သို့မဟုတ် Paste လုပ်ပါ။');
            return;
        }

        outputBox.value = 'ဘာသာပြန်နေပါသည်... ခဏစောင့်ပါ...';

        // Detect if input contains Myanmar Unicode characters
        const isMyanmar = /[\u1000-\u109F]/.test(text);
        
        // If Myanmar, translate to English ('en'). If English, translate to Myanmar ('my').
        const sourceLang = isMyanmar ? 'my' : 'en';
        const targetLang = isMyanmar ? 'en' : 'my';

        try {
            // Free Dual-direction Translation Engine ($0 Cost)
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            
            let translatedText = '';
            if (data && data[0]) {
                data[0].forEach(item => {
                    if (item[0]) translatedText += item[0];
                });
            }

            outputBox.value = translatedText;
        } catch (error) {
            outputBox.value = 'ဘာသာပြန်ရာတွင် အမှားအယွင်းရှိနေပါသည်။ အင်တာနက်ချိတ်ဆက်မှုကို စစ်ဆေးပါ။';
        }
    }
</script>

</body>
    </html>
